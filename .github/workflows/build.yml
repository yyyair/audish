name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx vsce package --no-git-tag-version --out audish.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: audish-${{ github.sha }}
          path: audish.vsix
          retention-days: 30
